services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gym-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=GymAdmin_2026!
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "GymAdmin_2026!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    container_name: gym-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=db;Database=GymManagementDb;User Id=sa;Password=GymAdmin_2026!;TrustServerCertificate=True;MultipleActiveResultSets=true
      - Jwt__Secret=CHANGE_ME_TO_A_32_PLUS_CHAR_SECRET_KEY
      - Jwt__Issuer=GymManagementAPI
      - Jwt__Audience=GymManagementApp
      - Seed__AdminPassword=Admin@123
      - ZKTecoBridge__ApiKey=zkteco-bridge-secret-2026
    ports:
      - "5000:5000"

volumes:
  sqldata:
